name: IPO Listing Day Reminder

# 공모주 상장일 매도 리마인더 — 상장 전날과 상장 당일, 아직 매도하지 않은(상태=대기)
# 신청 건에 대해 증권사·청약가와 함께 텔레그램으로 알린다.
#
# cron에 "*/10"을 줬지만 GitHub Actions가 빈번한 schedule 트리거를 상당히 걸러내서
# 실제로는 하루 3번 안팎, 그마저 지정 슬롯과 거리가 먼 임의 시각에 돈다 — 그래서
# "당일/전날" 판정 자체를 좁은 시간창이 아니라 넓은 창(ipo_listing_alert.py의
# in_morning_window/in_evening_window, 각각 08:00~21:00 / 12:00~23:59)으로 두고,
# 어떤 실행이든 그 안에만 걸리면 그날 1회 보내도록 한다(공모주알람로그로 중복 방지).
# 이래도 실행 자체가 하루 중 한 번도 안 돌면 못 보내므로, 세 cron 슬롯은 서로 다른
# 시각을 겨냥해 실행 기회를 늘리는 용도로 남겨둔다.
#
# 필요한 저장소 시크릿은 다른 stock 워크플로우와 동일 (STOCK_TELEGRAM_*, GOOGLE_*).

on:
  schedule:
    - cron: "*/10 11 * * 1-5"
    - cron: "*/10 23 * * 0-4"
    - cron: "*/10 0 * * 1-5"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check listing-day reminders
        env:
          STOCK_TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN }}
          STOCK_TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/stock/ipo_listing_alert.py
