name: IPO New Listing Alert

# 38.co.kr 공모주 청약일정을 하루 4번(평일 09/13/14/18시 KST) 확인해서, 새로 청약
# 가능해진 공모주가 있으면 공모주캘린더 탭에 기록하고 텔레그램으로 알린다. 그 외에도
# 공모가확정/청약 일주일전/청약 첫날/청약 마지막날 알림을 각각 최대 1회씩 보낸다
# (공모주알람로그 탭으로 dedup). 14시(KST) 슬롯은 "청약 마지막날" 알림이 반드시
# 오후 2시대에 나가도록 하기 위해 추가함 (ipo_new_alert.py의 in_afternoon_window 참고).
#
# 필요한 저장소 시크릿은 process-trades.yml / price-alert.yml과 동일 (STOCK_TELEGRAM_*,
# GOOGLE_*) — 이미 등록되어 있다면 추가 등록 불필요.

on:
  schedule:
    - cron: "0 0,4,5,9 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new IPOs
        env:
          STOCK_TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN }}
          STOCK_TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/stock/ipo_new_alert.py
