name: Process Stock Trades

# 텔레그램으로 들어온 매매/청약/공모매도 기록 메시지를 10분마다 폴링해서 구글시트(거래내역/
# 보유종목/공모주신청)와 구글 캘린더(주식&공모주 기록 전용)에 자동 반영한다. 증권사 앱
# 스크린샷(사진 메시지)을 보내면 OCR(Tesseract, 무료)로 공모가/상장예정일/환불일을 읽어서
# 같은 방식으로 반영한다(image_extract.py) — 과금 없는 방식을 원해서 비전 LLM 대신 OCR +
# 라벨 텍스트 기반 파싱을 씀.
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   - STOCK_TELEGRAM_BOT_TOKEN  (주식 기록 전용 봇 — 트렌드 알림 봇과 별개)
#   - STOCK_TELEGRAM_CHAT_ID
#   - GOOGLE_SERVICE_ACCOUNT_JSON  (구글 서비스 계정 키 JSON 전체)
#   - GOOGLE_SHEET_ID
#   - STOCK_GOOGLE_CALENDAR_ID  (매매/청약/상장 기록 전용 캘린더 ID — 기존 "주식&공모주" 캘린더)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR (한국어 데이터 포함)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process trades
        env:
          STOCK_TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN }}
          STOCK_TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STOCK_GOOGLE_CALENDAR_ID: ${{ secrets.STOCK_GOOGLE_CALENDAR_ID }}
        run: python scripts/stock/process_trades.py

      - name: Commit ticker map cache if changed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- scripts/stock/kr_ticker_map.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/stock/kr_ticker_map.json
            git commit -m "chore: 국내 종목코드 캐시 갱신"
            git push
          fi
