name: Stock Price Alert

# 보유 종목(국내+해외) 시세를 장중 30분 간격으로 확인해서, 전일 종가 대비 ±7% 이상
# 변동한 종목이 있으면 텔레그램으로 알림을 보낸다. 같은 실행에서 코스피 지수도 같이
# 확인해서 전일 대비 ±5% 이상(급등/급락 둘 다) 변동하면 알린다. 나스닥/S&P500은 임계치
# 없이 밤사이(미국장 마감 후) 올랐는지 내렸는지를 매일 아침 1회 요약해서 알린다.
#
# cron은 두 구간으로 나뉜다:
#   - "*/30 0-21 * * 1-5" : 한국(09:00~15:30 KST)과 미국(09:30~16:00 ET, 서머타임 포함)
#     장 시간을 넉넉히 포괄하는 UTC 0~21시 구간(평일) — 보유종목/코스피용. 실제 개장
#     여부는 scripts/stock/check_prices.py가 종목별 시장 기준으로 정확히 판단한다.
#   - "*/30 22-23 * * 1-5" : 나스닥/S&P500 아침 요약용 — UTC 월~금 22~23시 = KST 화~토
#     07:00~08:50 (미국 월~금 마감분을 그 다음날 아침에 챙긴다). UTC 일요일 슬롯은 넣지
#     않는다 — 주말엔 거래가 없어서 넣으면 토요일에 이미 보낸 금요일 종가가 월요일
#     아침에 중복으로 또 나가게 된다 (check_prices.py의 _nasdaq_summary_window도 월/일
#     아침은 이중 방어로 걸러낸다).
#
# 테스트 시 --dry-run을 붙이면 실제 텔레그램 전송/알람로그 기록 없이 콘솔에만 출력한다
# (workflow_dispatch 수동 실행 시 유용).
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   - STOCK_TELEGRAM_BOT_TOKEN  (주식 기록 전용 봇 — 트렌드 알림 봇과 별개)
#   - STOCK_TELEGRAM_CHAT_ID
#   - GOOGLE_SERVICE_ACCOUNT_JSON  (구글 서비스 계정 키 JSON 전체)
#   - GOOGLE_SHEET_ID

on:
  schedule:
    - cron: "*/30 0-21 * * 1-5"
    - cron: "*/30 22-23 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check prices
        env:
          STOCK_TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_TELEGRAM_BOT_TOKEN }}
          STOCK_TELEGRAM_CHAT_ID: ${{ secrets.STOCK_TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/stock/check_prices.py
